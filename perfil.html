<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfil - Loner HQ</title>
    <link rel="stylesheet" href="styles.css?v=profile-cover-standard-20260628" />
    <script type="module" src="script.js?v=profile-cover-standard-20260628"></script>
  </head>
  <body>
    <div class="site-shell">
      <aside class="sidebar" aria-label="Barra lateral">
        <a class="brand" href="index.html" aria-label="Loner HQ página inicial">
          <span class="brand-mark">LH</span>
          <span>
            <strong>Loner HQ</strong>
            <small>Arquivo de quadrinhos</small>
          </span>
        </a>

        <section class="auth-panel" aria-labelledby="authTitle">
          <div class="auth-heading">
            <h2 id="authTitle">Conta</h2>
            <span id="authBadge">...</span>
          </div>

          <form class="auth-form" id="loginForm" hidden>
            <label for="loginUser">E-mail</label>
            <input id="loginUser" name="usuario" type="email" autocomplete="email" required />

            <label for="loginPassword">Senha</label>
            <input id="loginPassword" name="senha" type="password" autocomplete="current-password" required />

            <button class="button primary" type="submit">Entrar</button>
            <button class="button ghost" type="button" id="showRegister">Cadastro</button>
          </form>

          <form class="auth-form" id="registerForm" hidden>
            <label for="registerUser">Novo e-mail</label>
            <input id="registerUser" name="novoUsuario" type="email" autocomplete="email" required />

            <label for="registerPassword">Criar senha</label>
            <input id="registerPassword" name="novaSenha" type="password" autocomplete="new-password" minlength="6" required />

            <label for="registerConfirm">Confirmar senha</label>
            <input id="registerConfirm" name="confirmarSenha" type="password" autocomplete="new-password" minlength="6" required />

            <button class="button primary" type="submit">Criar conta</button>
            <button class="button ghost" type="button" id="showLogin">Voltar</button>
          </form>

          <div class="account-panel" id="accountPanel" hidden></div>

          <p class="auth-message" id="authMessage" aria-live="polite"></p>
        </section>

        <nav class="wiki-nav" aria-label="Navegação principal">
          <a href="index.html" class="nav-link" data-section="inicio">HOME</a>
          <a href="Universos/universos.html" class="nav-link" data-section="universos">Universos</a>
          <a href="index.html#personagens" class="nav-link" data-section="personagens">Personagens</a>
          <a href="index.html#edicoes" class="nav-link" data-section="edicoes">Edições</a>
          <a href="index.html#cronologia" class="nav-link" data-section="cronologia">Cronologia</a>
        </nav>

        <section class="side-list" aria-labelledby="sideStats">
          <h2 id="sideStats">Acervo</h2>
          <dl>
            <div>
              <dt>Universos</dt>
              <dd>2</dd>
            </div>
            <div>
              <dt>Séries</dt>
              <dd>2</dd>
            </div>
            <div>
              <dt>Volumes</dt>
              <dd>4</dd>
            </div>
          </dl>
        </section>
      </aside>

      <div class="content-shell">
        <header class="topbar" aria-hidden="true"></header>

        <main class="wiki-page universe-layout">
          <article class="article">
            <nav class="breadcrumbs" aria-label="Caminho">
              <a href="index.html">Início</a>
              <span>/</span>
              <span>Perfil</span>
            </nav>

            <header class="article-header">
              <p class="namespace">Usuário</p>
              <h1>Perfil</h1>
              <p class="lead">Leituras, favoritos, avatar e progresso do usuário na Loner HQ.</p>
            </header>

            <div id="profilePage" class="public-profile"></div>
          </article>
        </main>

        <footer class="site-footer">
          <p>Loner HQ é um projeto local de catalogação de quadrinhos.</p>
        </footer>
      </div>
    </div>
  </body>
</html>
