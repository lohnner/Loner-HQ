<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfil - Loner HQ</title>
    <link rel="stylesheet" href="styles.css" data-loner-cache-bust />
    <script data-loner-app="script.js">
      (() => {
        const version = Date.now().toString();
        const stylesheet = document.querySelector("link[data-loner-cache-bust]");

        if (stylesheet) {
          const href = stylesheet.getAttribute("href");
          stylesheet.setAttribute("href", href + (href.includes("?") ? "&" : "?") + "v=" + version);
        }

        const app = document.createElement("script");
        app.type = "module";
        app.src = document.currentScript.dataset.lonerApp + "?v=" + version;
        document.head.append(app);
      })();
    </script>
  </head>
  <body>
    <div class="site-shell">
      <aside class="sidebar" aria-label="Barra lateral">
        <a class="brand sidebar-fallback-brand" href="index.html" aria-label="Loner HQ p&aacute;gina inicial">

            <strong>Loner HQ</strong>
            <small>Arquivo de quadrinhos</small>
          </span>
        </a>

        <nav class="wiki-nav sidebar-fallback-nav" aria-label="Navega&ccedil;&atilde;o principal">

          <a href="ranking.html" class="nav-link" data-section="ranking">Ranking de Usu&aacute;rios</a>
        </nav>
      </aside>

      <div class="content-shell">
        <header class="topbar" aria-hidden="true"></header>

        <main class="wiki-page universe-layout">
          <article class="article">
            <nav class="breadcrumbs" aria-label="Caminho">
              <a href="index.html">Início</a>
              <span>/</span>
              <span>Perfil</span>
            </nav>

            <header class="article-header">
              <h1>Perfil</h1>
              <p class="lead">Leituras, favoritos, avatar e progresso do usuário na Loner HQ.</p>
            </header>

            <div id="profilePage" class="public-profile"></div>

        </main>

        <footer class="site-footer">

      </div>
