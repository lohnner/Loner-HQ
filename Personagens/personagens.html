<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personagens - Loner HQ</title>
    <link rel="stylesheet" href="../styles.css" data-loner-cache-bust />
    <script data-loner-app="../script.js">
      (() => {
        const version = Date.now().toString();
        const stylesheet = document.querySelector("link[data-loner-cache-bust]");

        if (stylesheet) {
          const href = stylesheet.getAttribute("href");
          stylesheet.setAttribute("href", href + (href.includes("?") ? "&" : "?") + "v=" + version);
        }

        const app = document.createElement("script");
        app.type = "module";
        app.src = document.currentScript.dataset.lonerApp + "?v=" + version;
        document.head.append(app);
      })();
    </script>
  </head>
  <body>
    <div class="site-shell">
      <aside class="sidebar" aria-label="Barra lateral"></aside>

      <div class="content-shell">
        <header class="topbar" aria-hidden="true"></header>

        <main class="wiki-page universe-layout" id="personagens">
          <article class="article">
            <header class="article-header">
              <h1>Personagens</h1>
              <p class="lead">
                Lista dos personagens cadastrados na Loner HQ, organizada em ordem alfabética.
              </p>
            </header>

            <section class="universe-search-panel" role="search" aria-labelledby="characterSearchTitle">
              <label id="characterSearchTitle" for="characterSearch">Buscar personagem</label>
              <input id="characterSearch" type="search" placeholder="Digite o nome do personagem" autocomplete="off" />
              <p class="universe-search-status" id="characterSearchStatus" aria-live="polite">0 personagens</p>
            </section>

            <div class="character-grid" id="characterList" aria-label="Lista de personagens cadastrados"></div>
          </article>
        </main>

        <footer class="site-footer">
          <p>Loner HQ é um projeto local de catalogação de quadrinhos.</p>
        </footer>
      </div>
    </div>
  </body>
</html>
